<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aldea Logo Lab 3D</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230B0B0C'/%3E%3Cpath d='M10 28V15a6 6 0 0 1 12 0v13z' fill='%2300BEFF'/%3E%3C/svg%3E" />
    <style>
      :root {
        color-scheme: dark;
        --black: #0b0b0c;
        --white: #f2f2f0;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--black);
        color: var(--white);
        font-family: 'Jost', system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      #scene {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        display: block;
        outline: none;
        touch-action: none;
      }
      .hud {
        position: fixed;
        left: 18px;
        bottom: 16px;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: lowercase;
        opacity: 0.55;
        pointer-events: none;
        user-select: none;
        font-variant-numeric: tabular-nums;
      }
      .hud b {
        font-weight: 500;
        letter-spacing: 0.02em;
      }
      /* lil-gui con la paleta de la marca */
      .lil-gui.aldea-gui {
        --background-color: rgba(11, 11, 12, 0.88);
        --widget-color: #1d1d20;
        --hover-color: #26262a;
        --focus-color: #2e2e33;
        --number-color: #00beff;
        --string-color: #f2f2f0;
        --text-color: #f2f2f0;
        --title-background-color: #0b0b0c;
        --title-text-color: #f2f2f0;
        --font-family: 'Jost', system-ui, -apple-system, 'Segoe UI', sans-serif;
        --font-size: 11.5px;
        --widget-height: 22px;
        backdrop-filter: blur(8px);
      }
      @media (max-width: 720px) {
        .lil-gui.aldea-gui.root {
          width: calc(100vw - 16px) !important;
          right: 8px;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div class="hud"><b>aldea.</b> logo lab 3d · <span id="stats"></span></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
